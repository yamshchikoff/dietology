[package]
name = "dietology"
version = "0.1.0"
edition = "2021"
description = "Personal nutrition assistant"

[lib]
name = "dietology_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken = "3.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio-stream = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[[test]]
name = "llm_chat_integration"
harness = false
path = "tests/llm_chat_integration_test.rs"

[[test]]
name = "llm_session_integration"
harness = false
path = "tests/llm_session_integration_test.rs"

[[test]]
name = "browser_streaming"
path = "tests/browser_streaming_test.rs"
