<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dietology</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 12px 16px; border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .controls { display: flex; gap: 8px; }
    .controls button {
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .controls button:hover { background: #334155; color: #e2e8f0; }
    #chat {
      flex: 1; overflow-y: auto; padding: 16px;
      padding-bottom: env(safe-area-inset-bottom, 16px);
      display: flex; flex-direction: column; gap: 12px;
      scrollbar-color: #334155 #0f172a; scrollbar-width: thin;
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: #0f172a; }
    #chat::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .msg {
      max-width: 85%; padding: 10px 14px; border-radius: 10px;
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
    .msg.assistant { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
    .msg.system { align-self: center; background: #0f172a; color: #94a3b8; font-size: 12px; }
    .msg.error { align-self: center; background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
    #input-area {
      padding: 12px 16px; border-top: 1px solid #1e293b;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex; gap: 8px;
    }
    #input-area input {
      flex: 1; background: #1e293b; border: 1px solid #334155;
      padding: 10px 14px; border-radius: 8px; color: #e2e8f0; font-size: 14px;
      outline: none;
    }
    #input-area input:focus { border-color: #2563eb; }
    #input-area input::placeholder { color: #64748b; }
    #input-area button {
      background: #2563eb; color: #fff; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
    }
    #input-area button:hover { background: #3b82f6; }
    #input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    #input-area button:disabled:hover { background: #2563eb; }
    .status { padding: 4px 16px 8px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
<header>
  <h1>Dietology</h1>
  <div class="controls">
    <button onclick="saveSession()">Сохранить</button>
    <button onclick="loadSession()">Загрузить</button>
    <button onclick="clearSession()">Очистить</button>
  </div>
</header>

<div id="chat"></div>

<div class="status" id="status">Готов</div>

<div id="input-area">
  <input id="input" type="text" placeholder="Задайте вопрос о питании..." autofocus
    onkeydown="if(event.key==='Enter') send()">
  <button id="send-btn" onclick="send()">→</button>
</div>

<script>
if (!window.__TAURI__) {
  document.body.innerHTML = '<div class="msg error" style="text-align:center;padding:32px;">Tauri API недоступно. Запустите приложение через Tauri.</div>';
  throw new Error('Tauri API not available');
}
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;

let currentMsgElem = null;
let isStreaming = false;
let pendingTokens = '';
let tokenRafId = null;
let frozenUntilClear = false;

function hasSelection() {
  const sel = window.getSelection();
  return sel && sel.toString().length > 0;
}

function flushTokens() {
  if (currentMsgElem && pendingTokens && !frozenUntilClear && !hasSelection()) {
    currentMsgElem.textContent += pendingTokens;
    pendingTokens = '';
    scrollChat();
  }
  tokenRafId = null;
}

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  document.getElementById('chat').appendChild(d);
  scrollChat();
}

function scrollChat() {
  const c = document.getElementById('chat');
  if (c.scrollHeight - c.scrollTop - c.clientHeight < 80) {
    c.scrollTop = c.scrollHeight;
  }
}

function resetUI() {
  isStreaming = false;
  currentMsgElem = null;
  pendingTokens = '';
  if (tokenRafId) { cancelAnimationFrame(tokenRafId); tokenRafId = null; }
  document.getElementById('send-btn').disabled = false;
  document.getElementById('input').focus();
}

function renderMessages(messages) {
  for (const m of messages) {
    if (!Array.isArray(m.content)) continue;
    for (const b of m.content) {
      if (b.type === 'text') addMsg(m.role, b.text);
      else if (b.type === 'tool_use') addMsg('system', '[tool: ' + b.name + ']');
      else if (b.type === 'tool_result') addMsg('system', '[tool result]');
    }
  }
}

// Event listeners for streaming
listen('chat:token', (event) => {
  if (currentMsgElem) {
    pendingTokens += event.payload.delta ?? '';
    if (!frozenUntilClear && !hasSelection() && !tokenRafId) {
      tokenRafId = requestAnimationFrame(flushTokens);
    }
  }
});

listen('chat:tool_start', (event) => {
  if (currentMsgElem) {
    if (tokenRafId) { cancelAnimationFrame(tokenRafId); flushTokens(); }
    const annotation = `\n[tool: ${event.payload.name ?? '?'}...]\n`;
    if (frozenUntilClear || hasSelection()) {
      pendingTokens += annotation;
    } else {
      currentMsgElem.textContent += annotation;
      scrollChat();
    }
  }
});

listen('chat:tool_done', (_event) => {
  // Keep accumulated text — chat:done writes the authoritative final_text.
});

listen('chat:done', (event) => {
  if (tokenRafId) { cancelAnimationFrame(tokenRafId); flushTokens(); }
  if (currentMsgElem && !frozenUntilClear && !hasSelection()) {
    currentMsgElem.textContent = event.payload.final_text ?? currentMsgElem.textContent;
  }
  document.getElementById('status').textContent =
    `Токенов: ${event.payload.usage?.input_tokens ?? '?'} вх + ${event.payload.usage?.output_tokens ?? '?'} вых`;
  resetUI();
});

listen('chat:error', (event) => {
  if (tokenRafId) { cancelAnimationFrame(tokenRafId); flushTokens(); }
  if (currentMsgElem) {
    if (frozenUntilClear || hasSelection()) {
      pendingTokens += '\n\n[Ошибка: ' + (event.payload.message ?? 'неизвестная ошибка') + ']';
    } else if (currentMsgElem.textContent) {
      currentMsgElem.textContent += '\n\n[Ошибка: ' + (event.payload.message ?? 'неизвестная ошибка') + ']';
    } else {
      currentMsgElem.textContent = 'Ошибка: ' + (event.payload.message ?? 'неизвестная ошибка');
    }
  } else {
    addMsg('error', 'Ошибка: ' + (event.payload.message ?? 'неизвестная ошибка'));
  }
  document.getElementById('status').textContent = 'Ошибка';
  resetUI();
});

async function send() {
  const input = document.getElementById('input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if (!text || isStreaming) return;
  input.value = '';
  btn.disabled = true;
  isStreaming = true;
  document.getElementById('status').textContent = 'Думаю...';
  addMsg('user', text);

  // Create placeholder for streaming text
  const d = document.createElement('div');
  d.className = 'msg assistant';
  document.getElementById('chat').appendChild(d);
  scrollChat();
  currentMsgElem = d;

  try {
    await invoke('send_message', { text });
  } catch (e) {
    if (isStreaming) {
      if (tokenRafId) { cancelAnimationFrame(tokenRafId); flushTokens(); }
      const errMsg = typeof e === 'string' ? e : e.message || JSON.stringify(e);
      if (currentMsgElem.textContent) {
        currentMsgElem.textContent += '\n\n[Ошибка: ' + errMsg + ']';
      } else {
        currentMsgElem.textContent = 'Ошибка: ' + errMsg;
      }
      document.getElementById('status').textContent = 'Ошибка';
      resetUI();
    }
  }
}

async function saveSession() {
  const path = prompt('Путь для сохранения:', '/tmp/dietology_session.jsonl');
  if (!path) return;
  try { await invoke('save_session', { path }); document.getElementById('status').textContent = 'Сохранено в ' + path; }
  catch (e) { addMsg('error', 'Ошибка сохранения: ' + (typeof e === 'string' ? e : e.message || String(e))); }
}

async function loadSession() {
  const path = prompt('Путь для загрузки:', '/tmp/dietology_session.jsonl');
  if (!path) return;
  try {
    const info = await invoke('load_session', { path });
    document.getElementById('chat').innerHTML = '';
    renderMessages(info.messages);
    const promptPreview = (info.system_prompt || '').slice(0, 60);
    document.getElementById('status').textContent =
      `Загружено ${info.message_count} сообщений | ${promptPreview}${promptPreview.length >= 60 ? '...' : ''}`;
  } catch (e) { addMsg('error', 'Ошибка загрузки: ' + (typeof e === 'string' ? e : e.message || String(e))); }
}

async function clearSession() {
  try {
    await invoke('clear_session');
    document.getElementById('chat').innerHTML = '';
    addMsg('system', 'Сессия очищена.');
    document.getElementById('status').textContent = 'Готов';
  } catch (e) { addMsg('error', 'Ошибка очистки: ' + (typeof e === 'string' ? e : e.message || String(e))); }
}

// Init: start new chat
(async () => {
  try {
    const info = await invoke('new_chat', { systemPrompt: null });
    if (Array.isArray(info.messages) && info.messages.length > 0) {
      renderMessages(info.messages);
    } else {
      addMsg('system', 'Новая сессия. Задайте вопрос о питании.');
    }
    document.getElementById('status').textContent = 'Готов';
  } catch (e) {
    addMsg('error', 'Ошибка инициализации: ' + (e.message || String(e)));
    document.getElementById('status').textContent = 'Ошибка инициализации';
  }

  // Freeze DOM on LMB press, unfreeze when selection is cleared.
  document.getElementById('chat').addEventListener('mousedown', () => {
    frozenUntilClear = true;
    if (tokenRafId) { cancelAnimationFrame(tokenRafId); tokenRafId = null; }
  });
  document.addEventListener('selectionchange', () => {
    if (frozenUntilClear && !hasSelection()) {
      frozenUntilClear = false;
      flushTokens();
    }
  });
})();
</script>
</body>
</html>
